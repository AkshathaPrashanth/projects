version: '3.8'

services:
  # The Database: Stores all designs and user data
  mongo:
    image: mongo:latest
    container_name: fashion-db
    ports:
      # Changed host port to 27018 to avoid conflict with local MongoDB (27017)
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    restart: always

  # The Application: Multi-stage build
  fashion-design-ai:
    build:
      context: .
      args:
        # Passes the key from your host .env into the Dockerfile build process
        - API_KEY=${API_KEY}
    container_name: fashion-app
    ports:
      - "3001:3001"
    depends_on:
      - mongo
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_TYPE=mongodb
      # Internal networking uses the service name 'mongo' and internal port 27017
      - MONGO_URI=mongodb://mongo:27017/fashionai
      - API_KEY=${API_KEY}
    restart: always

volumes:
  mongo-data: