<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FashionDesignAI - Professional AI Pattern Studio</title>
    <meta name="theme-color" content="#EA580C" />
    
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3050/3050212.png" />
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-main: #F8FAFC;
        --bg-panel: rgba(255, 255, 255, 0.95);       
        --bg-element: #FFFFFF;
        --bg-element-hover: #F8FAFC; 
        --border: #F1F5F9;
        --border-hover: #E2E8F0;   
        --primary: #EA580C;
        --primary-hover: #C2410C;
        --accent: #F97316;
        --text-main: #0F172A;
        --text-muted: #475569;     
        --text-dim: #94A3B8;       
        --shadow-color: 20deg 10% 10%;
      }

      [data-theme='dark'] {
        --bg-main: #0F172A;
        --bg-panel: rgba(15, 23, 42, 0.9);       
        --bg-element: #1E293B;     
        --bg-element-hover: #334155; 
        --border: #334155;         
        --border-hover: #475569;   
        --primary: #F97316;
        --primary-hover: #FB923C;
        --accent: #FB923C;         
        --text-main: #F8FAFC;      
        --text-muted: #CBD5E1;     
        --text-dim: #64748B;       
      }

      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--bg-main);
        color: var(--text-main);
        height: 100vh;
        overflow: hidden;
        transition: background-color 0.4s cubic-bezier(0.4, 0, 0.2, 1), color 0.4s ease;
      }
      
      h1, h2, h3, h4, .font-serif { font-family: 'Playfair Display', serif; }
      ::-webkit-scrollbar { width: 4px; height: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--text-dim); border-radius: 4px; }
      
      .bg-main { background-color: var(--bg-main); }
      .bg-panel { background-color: var(--bg-panel); }
      .bg-element { background-color: var(--bg-element); }
      .border-theme { border-color: var(--border); }
      .shadow-vibrant { box-shadow: 0 10px 30px -10px hsl(var(--shadow-color) / 0.1); }

      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes zoomIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

      .animate-fade-in { animation: fadeIn 0.8s ease-out forwards; }
      .animate-fade-in-up { animation: fadeInUp 0.8s ease-out forwards; }
      .animate-fade-in-down { animation: fadeInDown 0.8s ease-out forwards; }
      .animate-zoom-in { animation: zoomIn 0.8s ease-out forwards; }
    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "vite": "https://esm.sh/vite@^7.3.0",
    "jspdf": "https://esm.sh/jspdf@^3.0.4",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "express": "https://esm.sh/express@^5.2.1",
    "path": "https://esm.sh/path@^0.12.7",
    "cors": "https://esm.sh/cors@^2.8.5",
    "url": "https://esm.sh/url@^0.11.4",
    "html2canvas": "https://esm.sh/html2canvas@^1.4.1",
    "mongoose": "https://esm.sh/mongoose@^9.1.1"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
